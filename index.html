<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Social — вход</title>
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#141414;--line:#292929;--text:#f5f5f5;--muted:#999;--accent:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#202020 0%,var(--bg) 55%);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}
    .wrap{width:min(100%,420px)}
    .brand{text-align:center;margin-bottom:28px}
    .mark{width:48px;height:48px;border:1px solid #444;border-radius:16px;display:grid;place-items:center;margin:0 auto 14px;font-size:22px;font-weight:700}
    h1{font-size:27px;letter-spacing:-1px;margin:0}
    .sub{color:var(--muted);margin:7px 0 0}
    .panel{background:rgba(20,20,20,.92);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 22px 70px #0008}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:#0c0c0c;padding:4px;border-radius:13px;margin-bottom:20px}
    .tab{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
    .tab.active{background:#292929;color:white}
    label{display:block;color:#c7c7c7;font-size:13px;margin:14px 0 7px}
    input{width:100%;padding:14px 13px;border:1px solid #333;border-radius:12px;background:#0b0b0b;color:white;font:inherit;outline:none}
    input:focus{border-color:#888}
    button.primary{width:100%;border:0;border-radius:12px;padding:14px;margin-top:20px;background:#f4f4f4;color:#111;font:700 15px inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .secondary{display:block;text-align:center;margin-top:15px;color:#aaa;background:none;border:0;width:100%;cursor:pointer}
    #message{min-height:22px;margin:14px 0 0;color:#ccc;text-align:center;font-size:13px}
    .foot{text-align:center;color:#666;font-size:12px;margin-top:18px}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="mark">S</div>
      <h1>Твоя сеть. Твои люди.</h1>
      <p class="sub">Войди или создай аккаунт</p>
    </header>
    <section class="panel">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">Войти</button>
        <button class="tab" id="signupTab" type="button">Регистрация</button>
      </div>
      <form id="authForm">
        <label for="email">Электронная почта</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Минимум 8 символов" minlength="8" required>
        <button class="primary" id="submitBtn" type="submit">Войти</button>
      </form>
      <button class="secondary" id="resetBtn" type="button">Забыли пароль?</button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <p class="foot">Social · ранняя версия</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://dajxzngoecrbmisuxhtx.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_79LOh2hHYrKZrsb8VgS6CQ_VoyEpoyM";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("authForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const resetBtn = document.getElementById("resetBtn");
    let mode = "login";

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#ff8585" : "#b9e6c5";
    }
    function setMode(next) {
      mode = next;
      loginTab.classList.toggle("active", mode === "login");
      signupTab.classList.toggle("active", mode === "signup");
      submitBtn.textContent = mode === "login" ? "Войти" : "Создать аккаунт";
      password.autocomplete = mode === "login" ? "current-password" : "new-password";
      showMessage("");
    }
    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      showMessage("Подключаемся…");
      try {
        const credentials = { email: email.value.trim(), password: password.value };
        const result = mode === "login"
          ? await client.auth.signInWithPassword(credentials)
          : await client.auth.signUp(credentials);
        if (result.error) throw result.error;
        if (mode === "signup" && !result.data.session) {
          showMessage("Аккаунт создан. Проверь почту и подтверди регистрацию.");
        } else {
          showMessage(mode === "login" ? "Вход выполнен." : "Аккаунт создан. Добро пожаловать!");
        }
      } catch (error) {
        showMessage(error.message || "Не удалось выполнить действие.", true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    resetBtn.addEventListener("click", async () => {
      const address = email.value.trim();
      if (!address) {
        showMessage("Сначала введи электронную почту.", true);
        email.focus();
        return;
      }
      resetBtn.disabled = true;
      try {
        const { error } = await client.auth.resetPasswordForEmail(address, {
          redirectTo: window.location.origin
        });
        if (error) throw error;
        showMessage("Если адрес зарегистрирован, письмо для сброса пароля отправлено.");
      } catch (error) {
        showMessage(error.message || "Не удалось отправить письмо.", true);
      } finally {
        resetBtn.disabled = false;
      }
    });

    client.auth.getSession().then(({ data }) => {
      if (data.session) showMessage("Ты уже вошёл в аккаунт.");
    });
  </script>
</body>
</html>
